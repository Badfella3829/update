<!DOCTYPE html>
<html>
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6111784142192967" crossorigin="anonymous"></script>
  <meta charset="UTF-8">
  <title>TechVyro AI Chat</title>

  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/ai.css">
  <link rel="stylesheet" href="css/premium.css">

  <style>
    #pageLoader {
      position: fixed;
      inset: 0;
      background: #020617;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .spinner {
      width: 46px;
      height: 46px;
      border: 4px solid #334155;
      border-top: 4px solid #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .chat-container {
      max-width: 800px;
      margin: 80px auto 20px;
      padding: 0 20px;
    }

    .chat-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .chat-header h2 {
      color: #fff;
      margin-bottom: 10px;
    }

    .chat-header p {
      color: #94a3b8;
      font-size: 14px;
    }

    .chat-messages {
      background: #0f172a;
      border-radius: 16px;
      padding: 20px;
      min-height: 400px;
      max-height: 500px;
      overflow-y: auto;
      margin-bottom: 20px;
      border: 1px solid #1e293b;
    }

    .message {
      margin-bottom: 20px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      text-align: right;
    }

    .message-content {
      display: inline-block;
      max-width: 80%;
      padding: 12px 18px;
      border-radius: 16px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .message.user .message-content {
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.assistant .message-content {
      background: #1e293b;
      color: #e2e8f0;
      border-bottom-left-radius: 4px;
    }

    .message-label {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 4px;
    }

    .chat-input-container {
      display: flex;
      gap: 12px;
      background: #0f172a;
      padding: 16px;
      border-radius: 16px;
      border: 1px solid #1e293b;
    }

    .chat-input {
      flex: 1;
      background: #1e293b;
      border: none;
      border-radius: 12px;
      padding: 14px 18px;
      color: #fff;
      font-size: 15px;
      resize: none;
      min-height: 50px;
      max-height: 150px;
    }

    .chat-input:focus {
      outline: none;
      box-shadow: 0 0 0 2px #3b82f6;
    }

    .chat-input::placeholder {
      color: #64748b;
    }

    .send-btn {
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      border: none;
      border-radius: 12px;
      padding: 14px 24px;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .send-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }

    .send-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 12px 18px;
    }

    .typing-indicator span {
      width: 8px;
      height: 8px;
      background: #64748b;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out;
    }

    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #64748b;
      text-decoration: none;
      margin-top: 20px;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: #3b82f6;
    }

    .clear-btn {
      background: transparent;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 16px;
      color: #64748b;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }

    .clear-btn:hover {
      border-color: #ef4444;
      color: #ef4444;
    }

    .chat-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

<div id="pageLoader">
  <div class="spinner"></div>
</div>

<div class="chat-container">

  <div class="chat-header">
    <h2>TechVyro AI Chat</h2>
    <p>Ask me anything - powered by advanced AI</p>
  </div>

  <div class="chat-content">
    <div class="chat-actions">
      <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
      <button class="clear-btn" id="clearBtn">Clear Chat</button>
    </div>

    <div class="chat-messages" id="chatMessages">
      <div class="message assistant">
        <div class="message-label">TechVyro AI</div>
        <div class="message-content">
          Hello! I'm TechVyro AI, your smart assistant. How can I help you today?
        </div>
      </div>
    </div>

    <div class="chat-input-container">
      <textarea 
        class="chat-input" 
        id="chatInput" 
        placeholder="Type your message..." 
        rows="1"
      ></textarea>
      <button class="send-btn" id="sendBtn">
        <span>Send</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
        </svg>
      </button>
    </div>
  </div>

</div>

<script>
  window.addEventListener("load", () => {
    document.getElementById("pageLoader").style.display = "none";
  });
</script>

<!-- Auth temporarily disabled for testing
<script type="module">
  import './js/auth-check.js';
</script>

<script src="js/auth-plan.js"></script>
<script src="js/premium-guard.js"></script>
-->

<script type="module">
  const chatMessages = document.getElementById('chatMessages');
  const chatInput = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');
  const clearBtn = document.getElementById('clearBtn');

  let chatHistory = [];
  let isLoading = false;

  function addMessage(content, role) {
    const messageDiv = document.createElement('div');
    messageDiv.className = `message ${role}`;
    messageDiv.innerHTML = `
      <div class="message-label">${role === 'user' ? 'You' : 'TechVyro AI'}</div>
      <div class="message-content">${escapeHtml(content)}</div>
    `;
    chatMessages.appendChild(messageDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    return messageDiv;
  }

  function addTypingIndicator() {
    const indicator = document.createElement('div');
    indicator.className = 'message assistant';
    indicator.id = 'typingIndicator';
    indicator.innerHTML = `
      <div class="message-label">TechVyro AI</div>
      <div class="typing-indicator">
        <span></span><span></span><span></span>
      </div>
    `;
    chatMessages.appendChild(indicator);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    return indicator;
  }

  function removeTypingIndicator() {
    const indicator = document.getElementById('typingIndicator');
    if (indicator) indicator.remove();
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML.replace(/\n/g, '<br>');
  }

  async function sendMessage() {
    const message = chatInput.value.trim();
    if (!message || isLoading) return;

    isLoading = true;
    sendBtn.disabled = true;
    chatInput.value = '';

    addMessage(message, 'user');
    chatHistory.push({ role: 'user', content: message });

    addTypingIndicator();

    try {
      const response = await fetch('/api/chat-simple', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, history: chatHistory.slice(-10) })
      });

      removeTypingIndicator();

      if (!response.ok) {
        throw new Error('Failed to get response');
      }

      const data = await response.json();
      
      if (data.error) {
        throw new Error(data.error);
      }

      const aiResponse = data.response || 'Sorry, I could not generate a response.';
      addMessage(aiResponse, 'assistant');
      chatHistory.push({ role: 'assistant', content: aiResponse });

    } catch (error) {
      removeTypingIndicator();
      console.error('Chat error details:', error);
      console.error('Error message:', error.message);
      addMessage('Sorry, something went wrong: ' + error.message, 'assistant');
    }

    isLoading = false;
    sendBtn.disabled = false;
    chatInput.focus();
  }

  sendBtn.addEventListener('click', sendMessage);

  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  chatInput.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 150) + 'px';
  });

  clearBtn.addEventListener('click', () => {
    chatHistory = [];
    chatMessages.innerHTML = `
      <div class="message assistant">
        <div class="message-label">TechVyro AI</div>
        <div class="message-content">
          Hello! I'm TechVyro AI, your smart assistant. How can I help you today?
        </div>
      </div>
    `;
  });
</script>

</body>
</html>
