<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice AI - TechVyro</title>
  <link rel="icon" href="logo-192.png" type="image/png">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <style>
    :root { --bg-dark: #020617; --card-bg: rgba(20, 26, 46, 0.6); --blue: #3b82f6; --purple: #a855f7; --text-main: #e5e7eb; --text-muted: #9aa0b4; --border: rgba(255,255,255,0.08); }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Inter, system-ui, sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
    .header { background: rgba(2, 6, 23, 0.95); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 100; }
    .back-btn { background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3); color: var(--blue); padding: 10px 20px; border-radius: 10px; cursor: pointer; font-size: 14px; text-decoration: none; transition: 0.2s; }
    .back-btn:hover { background: rgba(59, 130, 246, 0.2); }
    .header h1 { font-size: 20px; font-weight: 700; flex: 1; }
    .premium-badge { background: linear-gradient(135deg, #a855f7, #6366f1); padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .credits-badge { background: rgba(34,197,94,0.2); color: #22c55e; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; }
    .tool-container { flex: 1; max-width: 800px; margin: 0 auto; width: 100%; padding: 30px 20px; }
    .tool-description { color: var(--text-muted); margin-bottom: 25px; font-size: 15px; }
    textarea, select { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 12px; color: var(--text-main); padding: 15px; font-size: 14px; margin-bottom: 15px; }
    textarea { resize: none; }
    label { display: block; color: var(--text-muted); margin-bottom: 8px; font-size: 13px; }
    .btn { background: linear-gradient(135deg, #a855f7, #6366f1); color: white; border: none; padding: 14px 30px; border-radius: 10px; font-size: 15px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(168,85,247,0.4); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .result { margin-top: 25px; }
    audio { width: 100%; margin-top: 15px; border-radius: 10px; }
    .error { color: #ef4444; padding: 15px; background: rgba(239,68,68,0.1); border-radius: 10px; margin-top: 15px; }
    .loading-screen { position: fixed; inset: 0; background: var(--bg-dark); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .loading-screen.hidden { display: none; }
  </style>
  <link rel="stylesheet" href="css/premium-common.css">
</head>
<body>
  <div class="page-loader" id="pageLoader"><div class="loader-spinner"></div></div>
  <div id="loadingScreen" class="loading-screen">
    <div style="text-align: center; color: var(--text-muted);"><div style="font-size: 40px; margin-bottom: 15px;">⏳</div><p>Loading...</p></div>
  </div>

  <div class="header">
    <a href="dashboard.html" class="back-btn">← Back</a>
    <h1>🎙️ Voice AI</h1>
    <span class="premium-badge">Premium</span>
    <span id="creditsBadge" class="credits-badge">⚡ -- credits</span>
  </div>
  
  <div class="tool-container">
    <p class="tool-description">Convert text to natural speech using AI voices. (5 credits per generation)</p>
    
    <label>Enter Text</label>
    <textarea id="text" rows="6" placeholder="Type or paste the text you want to convert to speech..."></textarea>
    
    <label>Voice</label>
    <select id="voice">
      <option value="alloy">Alloy (Neutral)</option>
      <option value="echo">Echo (Male)</option>
      <option value="fable">Fable (British)</option>
      <option value="onyx">Onyx (Deep Male)</option>
      <option value="nova">Nova (Female)</option>
      <option value="shimmer">Shimmer (Soft Female)</option>
    </select>
    
    <button class="btn" id="generateBtn" onclick="generateVoice()">
      <span>🎙️ Generate Voice</span>
    </button>
    
    <div id="result" class="result"></div>
  </div>

  <script type="module">
    import { initAuthCredits, deductCredits, logToolUsage, getPlan } from './js/auth-credits.js';
    
    let authReady = false;
    let userPlan = 'free';
    
    initAuthCredits({ requireAuth: true, requirePremium: true, creditCost: 5 })
      .then(({ credits, plan }) => {
        document.getElementById('loadingScreen').classList.add('hidden');
        document.getElementById('creditsBadge').textContent = `⚡ ${credits} credits`;
        userPlan = plan;
        authReady = true;
      }).catch(err => console.log('Auth error:', err));
    
    window.generateVoice = async function() {
      if (!authReady) return;
      
      const text = document.getElementById('text').value.trim();
      const voice = document.getElementById('voice').value;
      const btn = document.getElementById('generateBtn');
      const result = document.getElementById('result');
      
      if (!text) { alert('Please enter some text'); return; }
      
      btn.disabled = true;
      btn.innerHTML = '<span>⏳ Generating...</span>';
      result.innerHTML = '<div style="color: var(--text-muted); padding: 20px;">Creating audio...</div>';
      
      try {
        const response = await fetch('/api/voice-ai/tts', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'X-User-Plan': userPlan
          },
          body: JSON.stringify({ text, voice })
        });
        
        const data = await response.json();
        
        if (data.success && data.audio) {
          const newCredits = await deductCredits(5);
          document.getElementById('creditsBadge').textContent = `⚡ ${newCredits} credits`;
          await logToolUsage('Voice AI');
          
          result.innerHTML = `
            <audio controls src="${data.audio}"></audio>
            <p style="margin-top: 15px; color: var(--text-muted);">Click play to listen</p>
          `;
        } else if (data.success && data.text) {
          // Fallback: text-to-speech not available, use browser TTS
          const newCredits = await deductCredits(5);
          document.getElementById('creditsBadge').textContent = `⚡ ${newCredits} credits`;
          await logToolUsage('Voice AI');
          const utterance = new SpeechSynthesisUtterance(data.text);
          window.speechSynthesis.speak(utterance);
          result.innerHTML = `
            <div style="background: rgba(0,0,0,0.3); border-radius: 12px; padding: 20px;">
              <p style="color: var(--text-main); margin-bottom: 12px;">${data.text}</p>
              <button onclick="window.speechSynthesis.speak(new SpeechSynthesisUtterance(${JSON.stringify(data.text)}))" style="background: var(--blue); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer;">🔊 Play Again</button>
            </div>
          `;
        } else {
          const errorMsg = (data && data.error) ? data.error : 'Failed to generate voice';
          result.innerHTML = `<div class="error">${errorMsg}</div>`;
        }
      } catch (error) {
        result.innerHTML = `<div class="error">Error: Could not connect to server</div>`;
      }
      
      btn.disabled = false;
      btn.innerHTML = '<span>🎙️ Generate Voice</span>';
    };
  </script>
    <div class="live-users-badge"><span class="pulse"></span><span id="liveCount">128</span> users online now</div>
  <button class="back-to-top" id="backToTop">↑</button>
  <button class="theme-toggle-fixed" id="themeToggle">🌙</button>
  <script src="js/premium-common.js"></script>
</body>
</html>
