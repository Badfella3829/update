<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Minify - TechVyro</title>
  <link rel="icon" href="logo-192.png" type="image/png">
  <style>
    :root { --bg-dark: #020617; --blue: #3b82f6; --text-main: #e5e7eb; --text-muted: #9aa0b4; --border: rgba(255,255,255,0.08); }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Inter, system-ui, sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
    .header { background: rgba(2, 6, 23, 0.95); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 100; }
    .back-btn { background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3); color: var(--blue); padding: 10px 20px; border-radius: 10px; font-size: 14px; text-decoration: none; transition: 0.2s; }
    .back-btn:hover { background: rgba(59, 130, 246, 0.2); }
    .header h1 { font-size: 20px; font-weight: 700; }
    .tool-container { flex: 1; max-width: 900px; margin: 0 auto; width: 100%; padding: 30px 20px; }
    .tool-description { color: var(--text-muted); margin-bottom: 25px; font-size: 15px; }
    select, textarea { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 12px; color: var(--text-main); padding: 15px; font-size: 14px; margin-bottom: 15px; }
    textarea { font-family: 'Fira Code', monospace; resize: vertical; }
    label { display: block; color: var(--text-muted); margin-bottom: 8px; font-size: 13px; }
    .btn { background: var(--blue); color: white; border: none; padding: 14px 30px; border-radius: 10px; font-size: 15px; cursor: pointer; transition: 0.2s; }
    .btn:hover { transform: translateY(-2px); }
    .result { margin-top: 20px; }
    .stats { background: rgba(34,197,94,0.1); color: #22c55e; padding: 12px 15px; border-radius: 10px; margin-bottom: 15px; }
    pre { background: rgba(0,0,0,0.4); padding: 20px; border-radius: 12px; color: #22c55e; overflow-x: auto; word-break: break-all; white-space: pre-wrap; font-family: 'Fira Code', monospace; font-size: 13px; }
    .copy-btn { background: rgba(59,130,246,0.2); color: var(--blue); border: 1px solid rgba(59,130,246,0.3); padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="header">
    <a href="dashboard.html" class="back-btn">← Back</a>
    <h1>⚡ Code Minify</h1>
  </div>
  
  <div class="tool-container">
    <p class="tool-description">Minify JavaScript and CSS code to reduce file size.</p>
    
    <label>Code Type</label>
    <select id="type">
      <option value="js">JavaScript</option>
      <option value="css">CSS</option>
    </select>
    
    <label>Your Code</label>
    <textarea id="input" rows="12" placeholder="Paste your code here..."></textarea>
    
    <button class="btn" onclick="minifyCode()">⚡ Minify</button>
    
    <div id="result" class="result"></div>
  </div>

  <script>
    let lastMinified = '';
    
    function minifyCode() {
      const type = document.getElementById('type').value;
      const input = document.getElementById('input').value;
      const result = document.getElementById('result');
      
      if (type === 'js') {
        lastMinified = input.replace(/\/\*[\s\S]*?\*\/|\/\/.*/g, '').replace(/\s+/g, ' ').replace(/\s*([{}();,:])\s*/g, '$1').trim();
      } else {
        lastMinified = input.replace(/\/\*[\s\S]*?\*\//g, '').replace(/\s+/g, ' ').replace(/\s*([{}:;,>+~])\s*/g, '$1').trim();
      }
      
      const originalSize = new Blob([input]).size;
      const minifiedSize = new Blob([lastMinified]).size;
      const savings = ((1 - minifiedSize / originalSize) * 100).toFixed(1);
      
      result.innerHTML = `
        <div class="stats">📉 Reduced by ${savings}% (${originalSize} → ${minifiedSize} bytes)</div>
        <pre>${escapeHtml(lastMinified)}</pre>
        <button class="copy-btn" onclick="copyMinified()">📋 Copy</button>
      `;
    }
    
    function escapeHtml(text) {
      return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    
    function copyMinified() {
      navigator.clipboard.writeText(lastMinified);
      alert('Copied!');
    }
  </script>
</body>
</html>
