<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create Account — TechVyro</title>
  <meta name="description" content="Create Account — TechVyro on TechVyro. Access AI-powered tools and resources designed to help creators, founders, and teams work faster.">

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="canonical" href="https://techvyro.in/signup.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Create Account — TechVyro">

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com https://www.gstatic.com https://pagead2.googlesyndication.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://lh3.googleusercontent.com; connect-src 'self' https://apis.google.com https://www.googleapis.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firebase.googleapis.com https://www.gstatic.com; frame-src 'self' https://techvyro-saas.firebaseapp.com https://accounts.google.com;">

  <style>
  /* ================= BRAND & THEME ================= */
  :root{
    --blue: #3b82f6;
    --blue-glow: rgba(59,130,246,0.35);
    --bg-dark: #020617;
    --text-main: #e5e7eb;
    --text-muted: #9aa0b4;
    --error: #ef4444;
    --success: #10b981;
  }

  /* ================= RESET ================= */
  *{box-sizing:border-box;margin:0;padding:0; font-family: 'Inter', system-ui, sans-serif;}

  body{
    background: var(--bg-dark);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-y: auto;
    overflow-x: hidden;
    position: relative;
    perspective: 1000px;
    padding: 40px 20px;
  }

  /* ================= BACKGROUND FX ================= */
  .hero-glow {
    position: absolute; top: -50%; left: 50%; transform: translateX(-50%);
    width: 100%; height: 100%;
    background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, transparent 70%);
    z-index: -2; pointer-events: none;
  }

  .grid-pattern {
    position: absolute; top: 0; left: 0; width: 100%; height: 100vh;
    background-image: 
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 50px 50px;
    mask-image: linear-gradient(to bottom, black 20%, transparent 100%);
    z-index: -1; pointer-events: none;
  }

  /* ================= 3D CARD ================= */
  .auth-card {
    background: rgba(20, 26, 46, 0.6);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    padding: 40px;
    border-radius: 24px;
    width: 100%; max-width: 440px;
    position: relative;
    box-shadow: 0 30px 60px rgba(0,0,0,0.5);
    
    /* 3D Properties */
    transform-style: preserve-3d;
    transform: perspective(1000px);
    transition: transform 0.1s ease;
    animation: floatUp 0.8s ease forwards;
    opacity: 0;
  }

  @keyframes floatUp {
    from { opacity: 0; transform: translateY(30px) rotateX(10deg); }
    to { opacity: 1; transform: translateY(0) rotateX(0); }
  }

  /* Inner Content Pop */
  .card-content { transform: translateZ(30px); }

  /* ================= HEADER ================= */
  .header { text-align: center; margin-bottom: 30px; }
  .logo { font-size: 32px; font-weight: 900; letter-spacing: -1px; text-decoration: none; display: block; margin-bottom: 5px; }
  .logo span { color: #fff; }
  .logo .blue { color: var(--blue); }
  .subtitle { color: var(--text-muted); font-size: 15px; }

  /* ================= FORM ELEMENTS ================= */
  .input-group { margin-bottom: 20px; }
  .label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: #cbd5e1; }

  .input-field {
    width: 100%; background: rgba(2, 6, 23, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #fff; padding: 14px 16px;
    border-radius: 12px; font-size: 15px; transition: 0.3s;
  }
  .input-field:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15); outline: none; }

  /* BUTTON */
  .btn {
    width: 100%; padding: 14px; background: var(--blue); color: #020617;
    font-weight: 800; font-size: 16px; border: none; border-radius: 12px;
    cursor: pointer; transition: 0.3s; margin-top: 10px;
    box-shadow: 0 10px 20px rgba(59,130,246,0.3);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(59,130,246,0.5); background: #60a5fa; }
  .btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

  /* DIVIDER */
  .or-divider {
    display: flex; align-items: center; gap: 12px;
    margin: 18px 0; color: var(--text-muted); font-size: 13px;
  }
  .or-divider::before, .or-divider::after {
    content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.08);
  }

  /* GOOGLE BUTTON */
  .btn-google {
    width: 100%; padding: 12px 16px;
    background: #fff; color: #3c4043;
    font-weight: 600; font-size: 15px;
    border: none; border-radius: 12px;
    cursor: pointer; transition: 0.3s;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .btn-google:hover { background: #f1f3f4; box-shadow: 0 4px 14px rgba(0,0,0,0.4); transform: translateY(-1px); }
  .btn-google:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
  .btn-google svg { flex-shrink: 0; }

  /* FOOTER & TOAST */
  .footer { margin-top: 25px; text-align: center; font-size: 14px; color: var(--text-muted); }
  .link { color: var(--blue); text-decoration: none; font-weight: 600; transition: .2s; }
  .link:hover { text-decoration: underline; color: #fff; }

  .toast {
    margin-top: 15px; padding: 12px; border-radius: 8px;
    font-size: 13px; font-weight: 600; text-align: center; display: none;
    animation: fadeIn 0.3s ease;
  }
  .toast.error { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.2); }
  .toast.success { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.2); }

  /* ================= PASSWORD STRENGTH ================= */
  .pw-strength-bar {
    height: 4px;
    border-radius: 2px;
    margin-top: 8px;
    background: rgba(255,255,255,0.08);
    overflow: hidden;
  }
  .pw-strength-fill {
    height: 100%;
    width: 0;
    border-radius: 2px;
    transition: width 0.3s ease, background-color 0.3s ease;
  }
  .pw-strength-label {
    font-size: 12px;
    margin-top: 5px;
    font-weight: 600;
    transition: color 0.3s ease;
  }
  .pw-strength-hidden { color: transparent; }

  /* BACK HOME */
  .back-home {
    position: absolute; top: 30px; left: 30px;
    color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 600;
    display: flex; align-items: center; gap: 8px; transition: 0.3s; z-index: 10;
  }
  .back-home:hover { color: #fff; transform: translateX(-5px); }

  /* Responsive - Tablet */
  @media (max-width: 768px) {
    body { overflow-y: auto; height: auto; min-height: 100vh; padding: 20px 0; }
    .auth-card { max-width: 400px; padding: 35px 28px; margin: 20px auto; }
    .back-home { top: 15px; left: 15px; font-size: 13px; }
  }

  /* Responsive - Mobile */
  @media (max-width: 480px) {
    body { padding: 15px; }
    .auth-card { padding: 28px 20px; margin: 15px; border-radius: 18px; }
    .logo { font-size: 26px; }
    .subtitle { font-size: 13px; }
    .label { font-size: 13px; }
    .input-field { padding: 12px 14px; font-size: 14px; border-radius: 10px; }
    .btn { padding: 12px; font-size: 15px; border-radius: 10px; }
    .footer { font-size: 13px; margin-top: 20px; }
    .back-home { top: 10px; left: 10px; font-size: 12px; }
    .input-group { margin-bottom: 16px; }
  }

  /* Small phones */
  @media (max-width: 360px) {
    .auth-card { padding: 22px 14px; }
    .logo { font-size: 22px; }
    .input-group { margin-bottom: 14px; }
    .header { margin-bottom: 20px; }
  }
  </style>
  <link rel="stylesheet" href="css/premium-common.css">
</head>
<body>
  <div class="page-loader" id="pageLoader"><div class="loader-spinner"></div></div>

  <div class="hero-glow"></div>
  <div class="grid-pattern"></div>

  <a href="index.html" class="back-home">← Back</a>

  <div class="auth-card js-tilt">
    <div class="card-content">
      
      <div class="header">
        <a href="index.html" class="logo">
          <span>Tech</span><span class="blue">Vyro</span>
        </a>
        <p class="subtitle">Join the premium AI revolution.</p>
      </div>

      <form id="signupForm" onsubmit="return false;">
        <div class="input-group">
          <label class="label" for="fullName">Full Name</label>
          <input type="text" id="fullName" class="input-field" placeholder="Your full name">
        </div>

        <div class="input-group">
          <label class="label" for="username">Email Address</label>
          <input type="email" id="username" class="input-field" placeholder="name@email.com" autocomplete="email" required>
        </div>

        <div class="input-group">
          <label class="label" for="password">Create Password</label>
          <input type="password" id="password" class="input-field" placeholder="At least 6 characters" autocomplete="new-password">
          <div class="pw-strength-bar"><div class="pw-strength-fill" id="pwStrengthFill"></div></div>
          <div class="pw-strength-label pw-strength-hidden" id="pwStrengthLabel">&#8203;</div>
        </div>

        <div class="input-group">
          <label class="label" for="referralCode">Referral Code (Optional)</label>
          <input type="text" id="referralCode" class="input-field" placeholder="Enter referral code to get rewards">
        </div>

        <div class="input-group" style="text-align: left; margin-bottom: 15px;">
          <label style="display: flex; align-items: flex-start; gap: 8px; font-size: 14px; color: #cbd5e1; cursor: pointer;">
            <input type="checkbox" id="termsCheckbox" style="margin-top: 2px;">
            <span>I agree to the <a href="terms.html" target="_blank" style="color: var(--blue); text-decoration: none;">Terms of Service</a>, <a href="privacy.html" target="_blank" style="color: var(--blue); text-decoration: none;">Privacy Policy</a>, and <a href="refund.html" target="_blank" style="color: var(--blue); text-decoration: none;">Refund Policy</a>.</span>
          </label>
        </div>

        <button id="signupBtn" class="btn" type="submit" disabled>Create Account</button>

        <div class="or-divider">or</div>

        <button id="googleBtn" type="button" class="btn-google">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            <path fill="none" d="M0 0h48v48H0z"/>
          </svg>
          <span class="google-btn-text">Continue with Google</span>
        </button>
      </form>

      <div id="toast" class="toast"></div>

      <div class="footer">
        Already have an account? <a href="login.html" class="link">Login</a>
      </div>

    </div>
  </div>

  <script type="module">
    // --- 3D TILT LOGIC ---
    document.querySelector('.js-tilt').addEventListener('mousemove', (e) => {
      const card = e.currentTarget;
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      
      const rotateX = ((y - centerY) / centerY) * -10;
      const rotateY = ((x - centerX) / centerX) * 10;

      card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
    });

    document.querySelector('.js-tilt').addEventListener('mouseleave', (e) => {
      e.currentTarget.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) scale(1)';
    });

    // --- FIREBASE IMPORTS ---
    import { auth, db } from './js/firebase.js';
    import { createUserWithEmailAndPassword, updateProfile, sendEmailVerification } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
    import { doc, setDoc, getDoc, updateDoc, serverTimestamp, collection, query, where, getDocs, addDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const btn = document.getElementById("signupBtn");
    const toast = document.getElementById("toast");
    const termsCheckbox = document.getElementById("termsCheckbox");

    const showToast = (msg, type) => {
      toast.className = `toast ${type}`;
      toast.innerText = msg;
      toast.style.display = "block";
      setTimeout(() => toast.style.display = "none", 4000);
    };

    window.showToast = showToast;

    // Enable/disable button based on checkbox
    termsCheckbox.addEventListener("change", () => {
      btn.disabled = !termsCheckbox.checked;
    });

    async function handleSignup() {
      const fullName = document.getElementById("fullName").value.trim();
      const u = document.getElementById("username").value.trim();
      const p = document.getElementById("password").value;
      const referralCode = (document.getElementById("referralCode").value.trim() ||
        new URLSearchParams(window.location.search).get('ref') || '').toUpperCase();

      if (!fullName || !u || !p) return showToast("Please fill in all fields", "error");
      if (!u.includes("@") || !u.includes(".")) return showToast("Please enter a valid email address", "error");
      if (p.length < 6) return showToast("Password must be 6+ chars", "error");

      const originalText = btn.innerText;
      btn.innerText = "Creating Account...";
      btn.disabled = true;
      btn.style.opacity = "0.7";

      let email = u;

      try {
        // Create Firebase Auth user
        const userCredential = await createUserWithEmailAndPassword(auth, email, p);
        const user = userCredential.user;

        // Update user profile with full name
        await updateProfile(user, { displayName: fullName });

        // Generate unique referral code for new user
        const userReferralCode = fullName.substring(0, 3).toUpperCase() + user.uid.substring(0, 5).toUpperCase();

        // Create Firestore user document
        await setDoc(doc(db, "users", user.uid), {
          uid: user.uid,
          email: email,
          name: fullName,
          displayName: fullName,
          plan: "free",
          credits: 100,
          emailVerified: false,
          blocked: false,
          referralCode: userReferralCode,
          referredBy: referralCode || null,
          createdAt: serverTimestamp(),
          lastLogin: null,
          lastLoginDevice: null
        });

        // Handle referral if provided
        if (referralCode) {
          try {
            // Find referrer by referral code field
            const referrerQuery = query(
              collection(db, "users"),
              where("referralCode", "==", referralCode)
            );
            const referrerSnap = await getDocs(referrerQuery);
            if (!referrerSnap.empty) {
              const referrerDoc = referrerSnap.docs[0];
              const referrerId = referrerDoc.id;

              // Add referral record
              const referralDocRef = await addDoc(collection(db, "referrals"), {
                referrerId: referrerId,
                referredId: user.uid,
                referralCode: referralCode,
                timestamp: new Date(),
                rewarded: false
              });

              // Reward referrer with 50 credits
              const currentCredits = referrerDoc.data().credits || 0;
              await updateDoc(doc(db, "users", referrerId), {
                credits: currentCredits + 50
              });

              // Mark referral as rewarded
              await updateDoc(referralDocRef, { rewarded: true });

              // Create in-app notification for referrer
              await addDoc(collection(db, "notifications"), {
                userId: referrerId,
                type: 'in_app',
                title: '🎉 Referral Reward!',
                message: 'Someone signed up using your referral code. You earned 50 credits!',
                priority: 'high',
                isRead: false,
                shown: false,
                createdAt: new Date()
              });
            }
          } catch (refErr) {
            console.log("Referral processing error:", refErr);
          }
        }

        // Send email verification
        await sendEmailVerification(user);

        showToast("Account Created! Please check your email to verify.", "success");
        setTimeout(() => location.href = "login.html", 2500);

      } catch (err) {
        let msg = err.message;
        if(msg.includes("email-already-in-use")) msg = "User already exists!";
        if(msg.includes("invalid-email")) msg = "Please enter a valid email address.";
        if(msg.includes("weak-password")) msg = "Password is too weak. Use at least 6 characters.";
        showToast(msg, "error");
        btn.innerText = originalText;
        btn.disabled = false;
        btn.style.opacity = "1";
      }
    }

    btn.addEventListener("click", (e) => {
      e.preventDefault();
      handleSignup();
    });

    document.getElementById("signupForm").addEventListener("submit", (e) => {
      e.preventDefault();
      handleSignup();
    });

    // Import Google sign-in
    import('./js/auth-google.js');
  </script>

  <script>
    // --- PASSWORD STRENGTH INDICATOR ---
    document.addEventListener('DOMContentLoaded', function() {
      var pwInput = document.getElementById('password');
      var pwFill = document.getElementById('pwStrengthFill');
      var pwLabel = document.getElementById('pwStrengthLabel');
      if (!pwInput || !pwFill || !pwLabel) return;

      pwInput.addEventListener('input', function() {
        var val = pwInput.value;
        var score = 0;
        if (val.length >= 6) score++;
        if (val.length >= 10) score++;
        if (/[A-Z]/.test(val)) score++;
        if (/[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;

        var levels = [
          { pct: '0%',   color: 'transparent', label: '\u200B',      labelColor: 'transparent' },
          { pct: '25%',  color: '#ef4444',      label: 'Weak',        labelColor: '#ef4444' },
          { pct: '50%',  color: '#f97316',      label: 'Fair',        labelColor: '#f97316' },
          { pct: '75%',  color: '#eab308',      label: 'Good',        labelColor: '#eab308' },
          { pct: '90%',  color: '#22c55e',      label: 'Strong',      labelColor: '#22c55e' },
          { pct: '100%', color: '#10b981',      label: 'Very Strong', labelColor: '#10b981' }
        ];
        var level = val.length === 0 ? levels[0] : levels[Math.min(score, levels.length - 1)];
        pwFill.style.width = level.pct;
        pwFill.style.backgroundColor = level.color;
        pwLabel.textContent = level.label;
        pwLabel.style.color = level.labelColor;
        pwLabel.classList.toggle('pw-strength-hidden', val.length === 0);
      });
    });
  </script>

    <div class="live-users-badge"><span class="pulse"></span><span id="liveCount">128</span> users online now</div>
  <button class="back-to-top" id="backToTop">↑</button>
  <button class="theme-toggle-fixed" id="themeToggle">🌙</button>
  <script src="js/premium-common.js"></script>
</body>
</html>
