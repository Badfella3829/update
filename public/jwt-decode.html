<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JWT Decode - TechVyro</title>
  <link rel="icon" href="logo-192.png" type="image/png">
  <style>
    :root { --bg-dark: #020617; --blue: #3b82f6; --text-main: #e5e7eb; --text-muted: #9aa0b4; --border: rgba(255,255,255,0.08); }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Inter, system-ui, sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
    .header { background: rgba(2, 6, 23, 0.95); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 100; }
    .back-btn { background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3); color: var(--blue); padding: 10px 20px; border-radius: 10px; font-size: 14px; text-decoration: none; transition: 0.2s; }
    .back-btn:hover { background: rgba(59, 130, 246, 0.2); }
    .header h1 { font-size: 20px; font-weight: 700; }
    .tool-container { flex: 1; max-width: 900px; margin: 0 auto; width: 100%; padding: 30px 20px; }
    .tool-description { color: var(--text-muted); margin-bottom: 25px; font-size: 15px; }
    textarea { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 12px; color: var(--text-main); padding: 15px; font-size: 14px; font-family: 'Fira Code', monospace; resize: vertical; margin-bottom: 15px; }
    .btn { background: var(--blue); color: white; border: none; padding: 14px 30px; border-radius: 10px; font-size: 15px; cursor: pointer; transition: 0.2s; }
    .btn:hover { transform: translateY(-2px); }
    .result { margin-top: 25px; }
    .section { margin-bottom: 20px; }
    .section h3 { color: var(--blue); margin-bottom: 10px; font-size: 16px; }
    pre { background: rgba(0,0,0,0.4); padding: 20px; border-radius: 12px; color: #22c55e; overflow-x: auto; white-space: pre-wrap; font-family: 'Fira Code', monospace; font-size: 13px; }
    .error { color: #ef4444; background: rgba(239,68,68,0.1); padding: 15px; border-radius: 10px; }
  </style>
</head>
<body>
  <div class="header">
    <a href="dashboard.html" class="back-btn">← Back</a>
    <h1>🔐 JWT Decode</h1>
  </div>
  
  <div class="tool-container">
    <p class="tool-description">Decode and inspect JSON Web Tokens.</p>
    
    <textarea id="token" rows="4" placeholder="Paste your JWT token here..."></textarea>
    
    <button class="btn" onclick="decodeJWT()">🔓 Decode Token</button>
    
    <div id="result" class="result"></div>
  </div>

  <script>
    function base64UrlDecode(str) {
      let base64 = str.replace(/-/g, '+').replace(/_/g, '/');
      while (base64.length % 4) base64 += '=';
      return atob(base64);
    }
    
    function decodeJWT() {
      const token = document.getElementById('token').value.trim();
      const result = document.getElementById('result');
      
      try {
        const parts = token.split('.');
        if (parts.length !== 3) throw new Error('Invalid JWT format - must have 3 parts');
        
        const header = JSON.parse(base64UrlDecode(parts[0]));
        const payload = JSON.parse(base64UrlDecode(parts[1]));
        
        let expiryInfo = '';
        if (payload.exp) {
          const expDate = new Date(payload.exp * 1000);
          const isExpired = expDate < new Date();
          expiryInfo = `<div style="padding: 10px 15px; border-radius: 10px; margin-bottom: 15px; ${isExpired ? 'background: rgba(239,68,68,0.1); color: #ef4444;' : 'background: rgba(34,197,94,0.1); color: #22c55e;'}">
            ${isExpired ? '⚠️ Token Expired' : '✅ Token Valid'} - Expires: ${expDate.toLocaleString()}
          </div>`;
        }
        
        result.innerHTML = `
          ${expiryInfo}
          <div class="section">
            <h3>📋 Header</h3>
            <pre>${JSON.stringify(header, null, 2)}</pre>
          </div>
          <div class="section">
            <h3>📦 Payload</h3>
            <pre>${JSON.stringify(payload, null, 2)}</pre>
          </div>
        `;
      } catch(e) {
        result.innerHTML = `<div class="error">❌ Error: ${e.message}</div>`;
      }
    }
  </script>
</body>
</html>
