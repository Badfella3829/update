  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #0f172a;
      color: #020617;
      padding: 30px;
    }

    /* ===== PAGE LOADER ===== */
    #pageLoader {
      position: fixed;
      inset: 0;
      background: #020617;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .spinner {
      width: 46px;
      height: 46px;
      border: 4px solid #334155;
      border-top: 4px solid #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ===== FADE IN PAGE ===== */
    .page {
      opacity: 0;
      transform: translateY(6px);
      animation: fadeIn .5s ease forwards;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: none;
      }
    }

    .card {
      background: #ffffff;
      max-width: 500px;
      margin: auto;
      padding: 28px;
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,.15);
    }

    h2 {
      margin-top: 0;
      font-size: 22px;
      font-weight: 800;
    }

    p {
      font-size: 14px;
      margin-bottom: 12px;
      font-weight: 600;
    }

    a {
      color: #4f46e5;
      font-weight: 700;
      text-decoration: none;
    }

    button {
      margin-top: 18px;
      padding: 12px 16px;
      background: linear-gradient(135deg,#6366f1,#4f46e5);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* ===== 🔥 PREMIUM SOCIAL ICONS (ADDED SAFE) ===== */
    .profile-social {
      margin-top: 26px;
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    .profile-social a {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: #020617;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 26px rgba(56,189,248,.35);
      transition: all .25s ease;
    }

    .profile-social a:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 40px rgba(56,189,248,.55);
    }

    .profile-social svg {
      width: 18px;
      height: 18px;
      fill: #38bdf8;
    }

    /* ================= 🔥 ADDED: PLAN BADGE STYLES ================= */

      font-size: 12px;

      margin-left: 6px;

    .badge.premium { background:#fde68a; color:#92400e; }
    .badge.admin { background:#c7d2fe; color:#1e3a8a; }

<script type="module" src="js/profile.js"></script>

<script>
  window.addEventListener("load", () => {
    document.getElementById("pageLoader").style.display = "none";
  });
</script>

<!-- ================= STEP-6 ADD START (SESSION SYNC + BADGE LOGIC) ================= -->
<script>
  const sessionUser = JSON.parse(localStorage.getItem("user"));
  if (sessionUser) {
    document.getElementById("role").innerText = sessionUser.role || "user";

    const badge = document.getElementById("planBadge");
    if (sessionUser.isPremium) {
      badge.innerText = "PREMIUM";
      badge.className = "badge premium";
    }
    if (sessionUser.role !== "user") {
      badge.innerText = sessionUser.role.toUpperCase();
      badge.className = "badge admin";
    }
  }
</script>
<!-- ================= STEP-6 ADD END ================= -->

<!-- ================= AUTH SECURITY ================= -->
<script type="module">
  import './js/auth-check.js';
</script>

<!-- ================= ACCOUNT CONTROL (ENHANCED) ================= -->
<script type="module">
  import { auth } from "js/firebase.js";
  import { signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { logout, deleteAccount, confirmAccountDeletion } from "js/account.js";
  import { showError, withErrorHandling } from "js/error-handler.js";

  // Enhanced logout with complete data cleanup
  window.logout = async function() {
    await withErrorHandling(async () => {
      await logout();
      showError("Logged out successfully. All local data cleared.", {
        type: 'info',
        showRetry: false,
        title: "Logged Out"
      });
      setTimeout(() => {
        location.href = "login.html";
      }, 1500);
    }, {
      showRetry: false,
      customMessage: "Logout failed. Please try again."
    });
  };

  // Account deletion with confirmation
  window.deleteAccount = async function() {
    const password = await confirmAccountDeletion();
    if (!password) return;

    await withErrorHandling(async () => {
      await deleteAccount(password);
      showError("Account deleted successfully. We're sorry to see you go.", {
        type: 'info',
        showRetry: false,
        title: "Account Deleted"
      });
      setTimeout(() => {
        location.href = "index.html";
      }, 2000);
    }, {
      showRetry: false,
      customMessage: "Account deletion failed. Please check your password and try again."
    });
  };
</script>
