<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="canonical" href="https://techvyro.in/profile.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Profile Settings | TechVyro">
  <meta property="og:description" content="Use Profile Settings | TechVyro on TechVyro for practical AI workflows and productivity gains.">
  <meta property="og:url" content="https://techvyro.in/profile.html">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Profile Settings | TechVyro">

  <title>Profile Settings | TechVyro</title>
  <meta name="description" content="Profile Settings | TechVyro on TechVyro. Access AI-powered tools and resources designed to help creators, founders, and teams work faster.">

  <link rel="icon" href="logo-192.png" type="image/png">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

  <style>
    :root {
      --bg-dark: #020617;
      --card-bg: rgba(20, 26, 46, 0.6);
      --blue: #3b82f6;
      --blue-glow: rgba(59,130,246,.35);
      --text-main: #e5e7eb;
      --text-muted: #9aa0b4;
      --border: rgba(255,255,255,0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Inter, system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px;
    }

    .hero-glow {
      position: fixed;
      top: -50%;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(59,130,246,0.1) 0%, transparent 70%);
      z-index: -2;
      pointer-events: none;
    }

    .grid-pattern {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background-image: 
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      mask-image: linear-gradient(to bottom, black 20%, transparent 100%);
      z-index: -1;
      pointer-events: none;
    }

    #pageLoader {
      position: fixed;
      inset: 0;
      background: var(--bg-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .spinner {
      width: 46px;
      height: 46px;
      border: 4px solid #334155;
      border-top: 4px solid var(--blue);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .page {
      max-width: 600px;
      margin: 0 auto;
      opacity: 0;
      animation: fadeIn 0.5s ease forwards;
    }

    @keyframes fadeIn { to { opacity: 1; } }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 24px;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--blue); }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .profile-avatar {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, var(--blue), #8b5cf6);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 800;
      color: #fff;
      box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
    }

    .profile-info h1 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .plan-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .plan-badge.free { background: rgba(34, 197, 94, 0.15); color: #22c55e; }
    .plan-badge.pro { background: rgba(59, 130, 246, 0.15); color: #3b82f6; }
    .plan-badge.premium { background: rgba(168, 85, 247, 0.15); color: #a855f7; }
    .plan-badge.admin { background: rgba(239, 68, 68, 0.15); color: #ef4444; }

    .card {
      background: linear-gradient(145deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 14px 16px;
      border-radius: 12px;
      color: var(--text-main);
      font-size: 15px;
      transition: all 0.3s;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }
    .form-input:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .form-input.readonly {
      background: rgba(255,255,255,0.02);
      color: var(--text-muted);
    }

    .input-with-btn {
      display: flex;
      gap: 10px;
    }
    .input-with-btn .form-input { flex: 1; }

    .btn {
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--blue), #4f46e5);
      color: white;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-main);
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,0.1);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #ef4444;
    }
    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.2);
    }

    .btn-success {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .info-row:last-child { border-bottom: none; }

    .info-label {
      font-size: 14px;
      color: var(--text-muted);
    }

    .info-value {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
    }

    .divider {
      height: 1px;
      background: rgba(255,255,255,0.06);
      margin: 10px 0;
    }

    .action-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .save-status {
      font-size: 12px;
      color: #22c55e;
      margin-left: 10px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .save-status.show { opacity: 1; }

    .social-icons {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 30px;
    }

    .s-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
      text-decoration: none;
    }
    .s-icon svg { width: 18px; height: 18px; fill: #94a3b8; }
    .s-icon.ig:hover { background: #E1306C; border-color: #E1306C; transform: translateY(-3px); }
    .s-icon.tg:hover { background: #229ED9; border-color: #229ED9; transform: translateY(-3px); }
    .s-icon.yt:hover { background: #FF0000; border-color: #FF0000; transform: translateY(-3px); }
    .s-icon:hover svg { fill: #fff; }

    .payment-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .payment-table th {
      text-align: left;
      padding: 12px;
      background: rgba(255,255,255,0.03);
      color: var(--text-muted);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .payment-table td {
      padding: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      color: var(--text-main);
    }
    .payment-table tbody tr:hover {
      background: rgba(255,255,255,0.02);
    }

    .status-badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }
    .status-badge.success { background: rgba(34,197,94,0.15); color: #22c55e; }
    .status-badge.pending { background: rgba(234,179,8,0.15); color: #eab308; }
    .status-badge.failed { background: rgba(239,68,68,0.15); color: #ef4444; }

    /* Tablet */
    @media (max-width: 768px) {
      .page { padding: 25px 15px; max-width: 100%; }
      .back-link { font-size: 13px; margin-bottom: 20px; }
      .card { padding: 22px; margin-bottom: 20px; }
      .card-title { font-size: 17px; margin-bottom: 18px; }
      .form-label { font-size: 12px; }
      .form-input { padding: 11px 13px; font-size: 14px; }
      .info-row { padding: 12px 0; }
      .info-label { font-size: 13px; }
      .info-value { font-size: 13px; }
    }

    /* Mobile */
    @media (max-width: 600px) {
      .page { padding: 20px 12px; }
      .profile-header { flex-direction: column; text-align: center; gap: 15px; }
      .profile-avatar { width: 80px; height: 80px; font-size: 32px; }
      .profile-info h1 { font-size: 22px; }
      .plan-badge { font-size: 11px; padding: 4px 12px; }
      .input-with-btn { flex-direction: column; gap: 10px; }
      .action-buttons { flex-direction: column; }
      .btn { width: 100%; justify-content: center; padding: 11px 16px; font-size: 13px; }
      .card { padding: 18px; border-radius: 16px; }
      .card-title { font-size: 16px; }
      .form-group { margin-bottom: 18px; }
      .social-icons { gap: 12px; margin-top: 20px; }
      .s-icon { width: 38px; height: 38px; }
      .payment-table { font-size: 12px; }
      .payment-table th, .payment-table td { padding: 10px 8px; }
      .back-link { font-size: 12px; }
    }

    /* Small phones */
    @media (max-width: 400px) {
      .page { padding: 15px 10px; }
      .profile-avatar { width: 70px; height: 70px; font-size: 28px; }
      .profile-info h1 { font-size: 20px; }
      .card { padding: 15px; }
      .form-input { padding: 10px 12px; font-size: 13px; }
      .info-row { flex-direction: column; align-items: flex-start; gap: 4px; }
    }
  </style>

</head>
<body>
  <div class="page-loader" id="pageLoader"><div class="loader-spinner"></div></div>
  <div class="hero-glow"></div>

  <div class="page">
    <a href="dashboard.html" class="back-link">← Back to Dashboard</a>

    <div class="profile-header">
      <div class="profile-avatar" id="profileAvatar">U</div>
      <div class="profile-info">
        <h1 id="profileName">Loading...</h1>
        <span class="plan-badge free" id="planBadge">FREE</span>
      </div>
    </div>

    <div class="card">
      <div class="card-title">👤 Personal Information</div>
      
      <div class="form-group">
        <label class="form-label">Display Name</label>
        <div class="input-with-btn">
          <input type="text" class="form-input" id="nameInput" placeholder="Enter your name">
          <button class="btn btn-primary" id="saveNameBtn" onclick="saveName()">Save</button>
        </div>
        <span class="save-status" id="saveStatus">Saved!</span>
      </div>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-input readonly" id="emailInput" disabled>
      </div>

      <div class="form-group">
        <label class="form-label">User ID</label>
        <input type="text" class="form-input readonly" id="uidInput" disabled>
      </div>
    </div>

    <div class="card">
      <div class="card-title">📊 Account Details</div>
      
      <div class="info-row">
        <span class="info-label">Account Type</span>
        <span class="info-value" id="accountType">Free</span>
      </div>
      <div class="info-row">
        <span class="info-label">Role</span>
        <span class="info-value" id="role">User</span>
      </div>
      <div class="info-row">
        <span class="info-label">Last Login</span>
        <span class="info-value" id="lastLogin">-</span>
      </div>
      <div class="info-row">
        <span class="info-label">Device</span>
        <span class="info-value" id="lastLoginDevice">-</span>
      </div>
    </div>

    <div class="card" id="securityAlertsCard" style="display: none;">
      <div class="card-title" style="color: #ef4444;">⚠️ Security Alerts</div>
      <div id="suspiciousActivityList"></div>
    </div>

    <div class="card">
      <div class="card-title">🧾 Billing & Payment History</div>
      
      <div id="lastTransaction" style="display: none; margin-bottom: 20px; padding: 15px; background: rgba(34,197,94,0.1); border-radius: 12px; border: 1px solid rgba(34,197,94,0.2);">
        <div style="font-weight: 600; color: #22c55e; margin-bottom: 5px;">Last Transaction</div>
        <div id="lastTransactionDetails" style="color: var(--text-muted); font-size: 14px;"></div>
      </div>

      <div style="overflow-x: auto;">
        <table class="payment-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Plan</th>
              <th>Amount</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="paymentTableBody">
            <tr>
              <td colspan="4" style="text-align: center; color: var(--text-muted); padding: 30px;">No payment history</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="card-title">⚙️ Account Actions</div>
      
      <div class="action-buttons">
        <button class="btn btn-secondary" onclick="logout()">🚪 Logout</button>
        <button class="btn btn-danger" onclick="deleteAccount()">🗑️ Delete Account</button>
      </div>
    </div>

    <div class="social-icons">
      <a href="https://instagram.com/techvyro" target="_blank" class="s-icon ig">

      </a>
      <a href="https://t.me/techvyro_x" target="_blank" class="s-icon tg">
        <svg viewBox="0 0 24 24"><path d="M9.78,18.65L10.06,14.42L17.74,7.5C18.08,7.19 17.67,7.04 17.22,7.31L7.74,13.3L3.64,12C2.76,11.75 2.75,11.14 3.84,10.7L19.81,4.54C20.54,4.21 21.24,4.72 20.96,5.84L18.24,18.65C18.05,19.56 17.5,19.8 16.74,19.36L12.6,16.3L10.61,18.23C10.38,18.46 10.19,18.65 9.78,18.65Z"/></svg>

  <script type="module">
    import { auth, db } from './js/firebase.js';
    import { onAuthStateChanged, updateProfile } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
    import { doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    let currentUser = null;

    // Fallback: always hide loader within this many ms to prevent permanent stuck state
    const LOADER_FALLBACK_MS = 4000;
    setTimeout(() => {
      const l = document.getElementById('pageLoader');
      if (l) l.style.display = 'none';
    }, LOADER_FALLBACK_MS);

    onAuthStateChanged(auth, async (user) => {
      document.getElementById('pageLoader').style.display = 'none';
      
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      currentUser = user;

      document.getElementById('emailInput').value = user.email || '';
      document.getElementById('uidInput').value = user.uid;

      try {
        const userDoc = await getDoc(doc(db, 'users', user.uid));
        let data = {};
        
        if (userDoc.exists()) {
          data = userDoc.data();
        } else {
          // Create Firestore document if it doesn't exist
          const defaultName = user.displayName || user.email?.split('@')[0] || 'User';
          data = {
            uid: user.uid,
            email: user.email,
            name: defaultName,
            displayName: defaultName,
            plan: 'free',
            credits: 100,
            emailVerified: user.emailVerified,
            blocked: false,
            createdAt: new Date()
          };
          await setDoc(doc(db, 'users', user.uid), data);
        }
        
        const name = data.name || data.displayName || user.displayName || user.email?.split('@')[0] || 'User';
        const plan = data.plan || 'free';
        const role = data.role || 'user';

        document.getElementById('nameInput').value = name;
        document.getElementById('profileName').textContent = name;
        document.getElementById('profileAvatar').textContent = name.charAt(0).toUpperCase();
        
        // Sync name to localStorage for dashboard
        localStorage.setItem('userName', name);

        const badge = document.getElementById('planBadge');
        badge.textContent = plan.toUpperCase();
        badge.className = 'plan-badge ' + plan;

        document.getElementById('accountType').textContent = plan.charAt(0).toUpperCase() + plan.slice(1);
        document.getElementById('role').textContent = role.charAt(0).toUpperCase() + role.slice(1);

        if (data.lastLogin) {
          const date = data.lastLogin.toDate ? data.lastLogin.toDate() : new Date(data.lastLogin);
          document.getElementById('lastLogin').textContent = date.toLocaleString();
        }
        if (data.lastLoginDevice) {
          document.getElementById('lastLoginDevice').textContent = data.lastLoginDevice;
        }

        if (data.paymentHistory && data.paymentHistory.length > 0) {
          const tbody = document.getElementById('paymentTableBody');
          tbody.innerHTML = data.paymentHistory.map(p => {
            const date = p.date?.toDate ? p.date.toDate() : new Date(p.date);
            return `
              <tr>
                <td>${date.toLocaleDateString()}</td>
                <td>${p.plan || '-'}</td>
                <td>₹${p.amount || 0}</td>
                <td><span class="status-badge ${p.status || 'success'}">${(p.status || 'success').toUpperCase()}</span></td>
              </tr>
            `;
          }).join('');
        }
      } catch (err) {
        console.error('Error loading profile:', err);
        const name = user.displayName || user.email?.split('@')[0] || 'User';
        document.getElementById('nameInput').value = name;
        document.getElementById('profileName').textContent = name;
        document.getElementById('profileAvatar').textContent = name.charAt(0).toUpperCase();
      }
    });

    window.saveName = async function() {
      const nameInput = document.getElementById('nameInput');
      const newName = nameInput.value.trim();
      
      if (!newName || !currentUser) return;

      const btn = document.getElementById('saveNameBtn');
      btn.disabled = true;
      btn.textContent = 'Saving...';

      try {
        // Update Firebase Auth profile
        await updateProfile(currentUser, { displayName: newName });
        
        // Update Firestore
        await setDoc(doc(db, 'users', currentUser.uid), {
          name: newName,
          displayName: newName,
          email: currentUser.email,
          updatedAt: new Date()
        }, { merge: true });

        document.getElementById('profileName').textContent = newName;
        document.getElementById('profileAvatar').textContent = newName.charAt(0).toUpperCase();
        
        // Update localStorage for faster sync across pages
        localStorage.setItem('userName', newName);
        const storedUser = JSON.parse(localStorage.getItem('user') || '{}');
        storedUser.name = newName;
        storedUser.displayName = newName;
        localStorage.setItem('user', JSON.stringify(storedUser));
        
        console.log('Name saved successfully:', newName);

        const status = document.getElementById('saveStatus');
        status.classList.add('show');
        setTimeout(() => status.classList.remove('show'), 2000);

        btn.textContent = 'Saved!';
        setTimeout(() => { btn.textContent = 'Save'; btn.disabled = false; }, 1500);
      } catch (err) {
        console.error('Error saving name:', err);
        btn.textContent = 'Error';
        setTimeout(() => { btn.textContent = 'Save'; btn.disabled = false; }, 1500);
      }
    };
  </script>

  <script type="module">
    import { auth } from './js/firebase.js';
    import { signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

    window.logout = async function() {
      try {
        await signOut(auth);
        localStorage.clear();
        sessionStorage.clear();
        window.location.href = 'login.html';
      } catch (err) {
        console.error('Logout error:', err);
        showToast('Logout failed. Please try again.', 'error');
      }
    };

    window.deleteAccount = async function() {
      const confirmed = confirm('Are you sure you want to delete your account? This action cannot be undone.');
      if (!confirmed) return;

      const password = prompt('Please enter your password to confirm:');
      if (!password) return;

      try {
        const { EmailAuthProvider, reauthenticateWithCredential, deleteUser } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js');
        const user = auth.currentUser;
        
        const credential = EmailAuthProvider.credential(user.email, password);
        await reauthenticateWithCredential(user, credential);
        await deleteUser(user);
        
        localStorage.clear();
        sessionStorage.clear();
        showToast('Account deleted successfully.', 'success');
        window.location.href = 'index.html';
      } catch (err) {
        console.error('Delete error:', err);
        showToast('Failed to delete account. Please check your password.', 'error');
      }
    };
  </script>

  <button class="theme-toggle-fixed" id="themeToggle">🌙</button>
  <script src="js/premium-common.js"></script>
</body>
