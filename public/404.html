<!DOCTYPE html>
<html lang="en">
  <head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6111784142192967" crossorigin="anonymous"></script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Not Found - TechVyro</title>
    <link rel="icon" type="image/x-icon" href="/logo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #020617;
        color: #e5e7eb;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
      }

      body::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: 
          linear-gradient(rgba(59, 130, 246, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(59, 130, 246, 0.03) 1px, transparent 1px);
        background-size: 50px 50px;
        pointer-events: none;
      }

      .container {
        text-align: center;
        padding: 40px;
        max-width: 500px;
        position: relative;
        z-index: 1;
      }

      .error-code {
        font-size: 120px;
        font-weight: 700;
        background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1;
        margin-bottom: 20px;
      }

      .error-title {
        font-size: 28px;
        font-weight: 600;
        color: #fff;
        margin-bottom: 16px;
      }

      .error-message {
        font-size: 16px;
        color: #9aa0b4;
        line-height: 1.6;
        margin-bottom: 32px;
      }

      .home-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #3b82f6;
        color: #fff;
        text-decoration: none;
        padding: 14px 32px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 16px;
        transition: all 0.3s ease;
        box-shadow: 0 8px 24px rgba(59, 130, 246, 0.3);
      }

      .home-btn:hover {
        background: #60a5fa;
        transform: translateY(-3px);
        box-shadow: 0 12px 32px rgba(59, 130, 246, 0.4);
      }

      .logo {
        margin-bottom: 40px;
      }

      .logo a {
        font-size: 28px;
        font-weight: 700;
        text-decoration: none;
      }

      .logo .tech {
        color: #fff;
      }

      .logo .vyro {
        color: #3b82f6;
      }

      @media (max-width: 600px) {
        .error-code {
          font-size: 80px;
        }

        .error-title {
          font-size: 22px;
        }

        .container {
          padding: 20px;
        }
      }
    </style>
  <link rel="stylesheet" href="css/premium-common.css">
  </head>
  <body>
  <div class="page-loader" id="pageLoader"><div class="loader-spinner"></div></div>
    <div class="container">
      <div class="logo">
        <a href="/">
          <span class="tech">Tech</span><span class="vyro">Vyro</span>
        </a>
      </div>
      <div class="error-code">404</div>
      <h1 class="error-title">Page Not Found</h1>
      <p class="error-message">
        Oops! The page you're looking for doesn't exist or has been moved. 
        Let's get you back on track.
      </p>
      <a href="/" class="home-btn">
        ← Back to Home
      </a>
    </div>
    <div class="live-users-badge"><span class="pulse"></span><span id="liveCount">128</span> users online now</div>
  <button class="back-to-top" id="backToTop">↑</button>
  <button class="theme-toggle-fixed" id="themeToggle">🌙</button>
  <script src="js/premium-common.js"></script>
  </body>
</html>
