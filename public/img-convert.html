<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Convert - TechVyro</title>
  <link rel="icon" href="logo-192.png" type="image/png">
  <style>
    :root { --bg-dark: #020617; --blue: #3b82f6; --text-main: #e5e7eb; --text-muted: #9aa0b4; --border: rgba(255,255,255,0.08); }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Inter, system-ui, sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
    .header { background: rgba(2, 6, 23, 0.95); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 100; }
    .back-btn { background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3); color: var(--blue); padding: 10px 20px; border-radius: 10px; font-size: 14px; text-decoration: none; transition: 0.2s; }
    .back-btn:hover { background: rgba(59, 130, 246, 0.2); }
    .header h1 { font-size: 20px; font-weight: 700; flex: 1; }
    .credits-badge { background: rgba(34,197,94,0.2); color: #22c55e; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; }
    .tool-container { flex: 1; max-width: 700px; margin: 0 auto; width: 100%; padding: 30px 20px; }
    .tool-description { color: var(--text-muted); margin-bottom: 25px; font-size: 15px; }
    .upload-area { border: 2px dashed var(--border); border-radius: 16px; padding: 40px; text-align: center; cursor: pointer; transition: 0.2s; margin-bottom: 20px; }
    .upload-area:hover { border-color: var(--blue); background: rgba(59,130,246,0.05); }
    input[type="file"] { display: none; }
    select { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 12px; color: var(--text-main); padding: 15px; font-size: 14px; margin-bottom: 15px; }
    label { display: block; color: var(--text-muted); margin-bottom: 8px; font-size: 13px; }
    .btn { background: var(--blue); color: white; border: none; padding: 14px 30px; border-radius: 10px; font-size: 15px; cursor: pointer; transition: 0.2s; width: 100%; }
    .btn:hover { transform: translateY(-2px); }
    .result { margin-top: 25px; text-align: center; }
    .result img { max-width: 100%; max-height: 350px; border-radius: 12px; margin: 15px 0; }
    .download-btn { display: inline-block; background: #22c55e; color: white; padding: 12px 25px; border-radius: 10px; text-decoration: none; margin-top: 15px; }
    .loading-screen { position: fixed; inset: 0; background: var(--bg-dark); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .loading-screen.hidden { display: none; }
  </style>
  <link rel="stylesheet" href="css/premium-common.css">
</head>
<body>
  <div class="page-loader" id="pageLoader"><div class="loader-spinner"></div></div>
  <div id="loadingScreen" class="loading-screen">
    <div style="text-align: center; color: var(--text-muted);"><div style="font-size: 40px; margin-bottom: 15px;">⏳</div><p>Loading...</p></div>
  </div>

  <div class="header">
    <a href="dashboard.html" class="back-btn">← Back</a>
    <h1>🖼️ Image Convert</h1>
    <span id="creditsBadge" class="credits-badge">⚡ -- credits</span>
  </div>
  
  <div class="tool-container">
    <p class="tool-description">Convert images between different formats. (5 credits per use)</p>
    
    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
      <p style="font-size: 40px; margin-bottom: 10px;">📁</p>
      <p>Click to select an image</p>
    </div>
    <input type="file" id="fileInput" accept="image/*" onchange="handleFile(this)">
    
    <label>Convert to</label>
    <select id="format">
      <option value="png">PNG</option>
      <option value="jpeg">JPEG</option>
      <option value="webp">WebP</option>
    </select>
    
    <button class="btn" onclick="convertImage()">🔄 Convert</button>
    
    <div id="result" class="result"></div>
  </div>

  <script type="module">
    import { initAuthCredits, deductCredits, logToolUsage } from './js/auth-credits.js';
    
    let selectedFile = null;
    let authReady = false;
    let creditsDeducted = false;
    
    initAuthCredits({ requireAuth: true, requirePremium: false, creditCost: 5 })
      .then(({ credits }) => {
        document.getElementById('loadingScreen').classList.add('hidden');
        document.getElementById('creditsBadge').textContent = `⚡ ${credits} credits`;
        authReady = true;
      }).catch(err => console.log('Auth error:', err));
    
    window.handleFile = function(input) {
      if (input.files[0]) {
        selectedFile = input.files[0];
        document.querySelector('.upload-area p:first-child').textContent = '✅';
        document.querySelector('.upload-area p:nth-child(2)').textContent = selectedFile.name;
      }
    };
    
    window.convertImage = async function() {
      if (!authReady) return;
      if (!selectedFile) { showToast('Please select an image first', 'warning'); return; }
      
      const format = document.getElementById('format').value;
      const result = document.getElementById('result');
      result.innerHTML = '<p style="color: var(--text-muted);">Converting...</p>';
      
      const reader = new FileReader();
      reader.onload = async (e) => {
        const img = new Image();
        img.onload = async () => {
          const canvas = document.createElement('canvas');
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          
          const mimeType = format === 'jpeg' ? 'image/jpeg' : format === 'webp' ? 'image/webp' : 'image/png';
          canvas.toBlob(async (blob) => {
            const url = URL.createObjectURL(blob);
            
            if (!creditsDeducted) {
              const newCredits = await deductCredits(5);
              document.getElementById('creditsBadge').textContent = `⚡ ${newCredits} credits`;
              await logToolUsage('Image Convert');
              creditsDeducted = true;
            }
            
            result.innerHTML = `
              <img src="${url}" alt="Converted">
              <br>
              <a href="${url}" download="converted.${format}" class="download-btn">⬇️ Download ${format.toUpperCase()}</a>
            `;
          }, mimeType, 0.92);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(selectedFile);
    };
  </script>
    <div class="live-users-badge"><span class="pulse"></span><span id="liveCount">128</span> users online now</div>
  <button class="back-to-top" id="backToTop">↑</button>
  <button class="theme-toggle-fixed" id="themeToggle">🌙</button>
  <script src="js/premium-common.js"></script>
</body>
</html>
