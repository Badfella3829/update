<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6111784142192967" crossorigin="anonymous"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Tool Builder | TechVyro</title>

  <!-- 🔒 GLOBAL + AI + PREMIUM UI -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/ai.css">
  <link rel="stylesheet" href="css/premium.css">
  <link rel="stylesheet" href="css/premium-common.css">

  <style>
    /* ===== PAGE LOADER (SAME UI) ===== */
    #pageLoader{
      position: fixed;
      inset: 0;
      background: #020617;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .spinner{
      width: 46px;
      height: 46px;
      border: 4px solid #334155;
      border-top: 4px solid #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin{
      to{ transform: rotate(360deg); }
    }

    /* ===== PAGE WRAPPER (NO UI CHANGE) ===== */
    .builder-wrap{
      max-width: 640px;
      margin: 80px auto;
      text-align: center;
    }

    h2{
      margin-bottom: 20px;
    }

    a.back{
      display: inline-block;
      margin-top: 20px;
    }

    /* ================= MOBILE RESPONSIVE ================= */
    @media (max-width: 768px) {
      .builder-wrap {
        margin: 60px auto;
        padding: 0 16px;
      }
    }
  </style>
</head>

<body>

<!-- PAGE LOADER -->
<div id="pageLoader">
  <div class="spinner"></div>
</div>

<div class="builder-wrap">

  <h2>AI Tool Builder</h2>

  <!-- 🔥 PREMIUM WRAPPER (UNCHANGED LOGIC) -->
  <div class="premium-only">

    <input id="toolName" type="text" placeholder="Tool Name">
    <br><br>

    <textarea id="toolDesc" placeholder="What should this AI tool do?" rows="5"></textarea>
    <br><br>

    <select id="toolPlan">
      <option>Free</option>
      <option>Pro</option>
      <option>Premium</option>
    </select>
    <br><br>

    <button type="button" class="premium-btn" id="buildBtn">
      Build Tool
    </button>

    <pre id="buildResult">Tool output will appear here...</pre>

  </div>

  <hr>

  <a href="dashboard.html" class="back">← Back to Dashboard</a>

</div>

<!-- ORIGINAL LOADER LOGIC (UNCHANGED) -->
<script>
  window.addEventListener("load", () => {
    document.getElementById("pageLoader").style.display = "none";
  });
</script>

<script>
  window.addEventListener("load", () => {
    document.body.classList.add("loaded");
  });
</script>

<!-- ================= AUTH SECURITY ================= -->
<script type="module">
  import './js/auth-check.js';
</script>

<!-- PREMIUM GUARDS (UNCHANGED) -->
<script type="module" src="js/auth-plan.js"></script>
<script type="module" src="js/premium-guard.js"></script>

<!-- ================= 🔐 USAGE LIMIT LOGIC (UPDATED) ================= -->
<script type="module">
  import { auth } from "js/firebase.js";
  import { checkUsageLimit, checkRateLimit, logUsage } from "js/credits.js";
  import { showError, withErrorHandling } from "js/error-handler.js";

  let currentUser = null;

  auth.onAuthStateChanged(async (user) => {
    currentUser = user;
  });

  const buildBtn = document.getElementById("buildBtn");
  const output = document.getElementById("buildResult");

  buildBtn.addEventListener("click", async () => {
    if (!currentUser) {
      location.href = "login.html";
      return;
    }

    await withErrorHandling(async () => {
      // Check daily usage limit
      const limitExceeded = await checkUsageLimit(currentUser.uid, "ai_builder");
      if (limitExceeded) {
        showError("You've reached your daily limit of 5 AI tool builds. Upgrade to Premium for unlimited access.", {
          showRetry: false,
          title: "Daily Limit Reached"
        });
        return;
      }

      // Check rate limit (30 seconds between actions)
      const rateLimited = await checkRateLimit(currentUser.uid, "ai_builder");
      if (rateLimited) {
        showError("Please wait 30 seconds before building another tool.", {
          showRetry: false,
          title: "Too Many Requests"
        });
        return;
      }

      // Log the usage
      await logUsage(currentUser.uid, "ai_builder");

      output.innerText =
        "🛠 Tool Builder (Demo)\n\n" +
        "Tool created successfully.\n\n" +
        "Note: Limits are now enforced server-side for better security.";
    }, {
      showRetry: true,
      customMessage: "Failed to build your AI tool. Please try again."
    });
  });
</script>

  <div class="live-users-badge"><span class="pulse"></span><span id="liveCount">128</span> users online now</div>
  <button class="back-to-top" id="backToTop">↑</button>
  <button class="theme-toggle-fixed" id="themeToggle">🌙</button>
  <script src="js/premium-common.js"></script>
</body>
</html>
