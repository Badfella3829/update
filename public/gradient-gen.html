<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gradient Generator - TechVyro</title>
  <link rel="icon" href="logo-192.png" type="image/png">
  <style>
    :root { --bg-dark: #020617; --blue: #3b82f6; --text-main: #e5e7eb; --text-muted: #9aa0b4; --border: rgba(255,255,255,0.08); }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Inter, system-ui, sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
    .header { background: rgba(2, 6, 23, 0.95); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 100; }
    .back-btn { background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3); color: var(--blue); padding: 10px 20px; border-radius: 10px; font-size: 14px; text-decoration: none; transition: 0.2s; }
    .back-btn:hover { background: rgba(59, 130, 246, 0.2); }
    .header h1 { font-size: 20px; font-weight: 700; flex: 1; }
    .credits-badge { background: rgba(34,197,94,0.2); color: #22c55e; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; }
    .tool-container { flex: 1; max-width: 800px; margin: 0 auto; width: 100%; padding: 30px 20px; }
    .tool-description { color: var(--text-muted); margin-bottom: 25px; font-size: 15px; }
    .color-row { display: flex; gap: 15px; margin-bottom: 15px; align-items: center; }
    .color-row input[type="color"] { width: 60px; height: 50px; border: none; border-radius: 10px; cursor: pointer; }
    select { flex: 1; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 12px; color: var(--text-main); padding: 15px; font-size: 14px; }
    label { display: block; color: var(--text-muted); margin-bottom: 8px; font-size: 13px; }
    .btn { background: var(--blue); color: white; border: none; padding: 14px 30px; border-radius: 10px; font-size: 15px; cursor: pointer; transition: 0.2s; margin-top: 15px; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(59,130,246,0.4); }
    .preview { width: 100%; height: 200px; border-radius: 16px; margin: 25px 0; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
    .code { background: rgba(0,0,0,0.3); padding: 20px; border-radius: 12px; font-family: monospace; color: #22c55e; margin-bottom: 15px; word-break: break-all; }
    .copy-btn { background: rgba(59, 130, 246, 0.2); color: var(--blue); border: 1px solid rgba(59, 130, 246, 0.3); padding: 10px 20px; border-radius: 8px; cursor: pointer; }
    .loading-screen { position: fixed; inset: 0; background: var(--bg-dark); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .loading-screen.hidden { display: none; }
  </style>
</head>
<body>
  <div id="loadingScreen" class="loading-screen">
    <div style="text-align: center; color: var(--text-muted);"><div style="font-size: 40px; margin-bottom: 15px;">⏳</div><p>Loading...</p></div>
  </div>

  <div class="header">
    <a href="dashboard.html" class="back-btn">← Back</a>
    <h1>🌈 Gradient Generator</h1>
    <span id="creditsBadge" class="credits-badge">⚡ -- credits</span>
  </div>
  
  <div class="tool-container">
    <p class="tool-description">Create stunning CSS gradients for your projects. (5 credits per use)</p>
    
    <label>Colors</label>
    <div class="color-row">
      <input type="color" id="color1" value="#667eea">
      <input type="color" id="color2" value="#764ba2">
    </div>
    
    <label>Type</label>
    <select id="type">
      <option value="linear">Linear</option>
      <option value="radial">Radial</option>
    </select>
    
    <div id="angleRow" style="margin-top: 15px;">
      <label>Angle: <span id="angleVal">135</span>°</label>
      <input type="range" id="angle" min="0" max="360" value="135" style="width: 100%;" oninput="document.getElementById('angleVal').textContent = this.value; generateGradient()">
    </div>
    
    <button class="btn" onclick="generateGradient()">🌈 Generate</button>
    
    <div id="preview" class="preview"></div>
    <div id="code" class="code"></div>
    <button class="copy-btn" onclick="copyCSS()">📋 Copy CSS</button>
  </div>

  <script type="module">
    import { initAuthCredits, deductCredits, logToolUsage } from './js/auth-credits.js';
    
    let currentCSS = '';
    let authReady = false;
    let creditsDeducted = false;
    
    initAuthCredits({ requireAuth: true, requirePremium: false, creditCost: 5 })
      .then(({ credits }) => {
        document.getElementById('loadingScreen').classList.add('hidden');
        document.getElementById('creditsBadge').textContent = `⚡ ${credits} credits`;
        authReady = true;
        generateGradient();
      }).catch(err => console.log('Auth error:', err));
    
    window.generateGradient = async function() {
      const color1 = document.getElementById('color1').value;
      const color2 = document.getElementById('color2').value;
      const type = document.getElementById('type').value;
      const angle = document.getElementById('angle').value;
      
      document.getElementById('angleRow').style.display = type === 'linear' ? 'block' : 'none';
      
      currentCSS = type === 'linear' 
        ? `linear-gradient(${angle}deg, ${color1}, ${color2})`
        : `radial-gradient(circle, ${color1}, ${color2})`;
      
      document.getElementById('preview').style.background = currentCSS;
      document.getElementById('code').textContent = `background: ${currentCSS};`;
      
      if (authReady && !creditsDeducted) {
        const newCredits = await deductCredits(5);
        document.getElementById('creditsBadge').textContent = `⚡ ${newCredits} credits`;
        await logToolUsage('Gradient Generator');
        creditsDeducted = true;
      }
    };
    
    window.copyCSS = function() {
      navigator.clipboard.writeText(`background: ${currentCSS};`);
      alert('CSS copied!');
    };
  </script>
</body>
</html>
